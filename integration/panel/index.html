<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型与推理等级</title><link rel="stylesheet" href="/panel.css"><script defer src="/preload.js"></script><script defer src="/panel.js"></script></head>
<body><main><header><h1>模型与推理等级</h1></header>
<section aria-labelledby="connection-title"><h2 id="connection-title">ChatGPT 订阅</h2>
<p id="connection" role="status">正在连接宿主…</p><div id="conn-actions" class="conn-actions" hidden><button id="signin" type="button" hidden>Continue with ChatGPT</button><button id="refresh" type="button" hidden>刷新目录</button></div>
<p id="notice" role="alert" hidden></p></section>
<section aria-labelledby="models-title"><div class="title"><h2 id="models-title">显示的模型</h2><button type="button" id="models-none">取消全选</button></div><div id="models"></div></section>
<section aria-labelledby="efforts-title"><div class="title"><h2 id="efforts-title">显示的推理等级</h2><button type="button" id="efforts-none">取消全选</button></div>
<div id="efforts"></div><p id="selection-summary" aria-live="polite"></p></section>
<section aria-labelledby="skill-title">
<h2 id="skill-title">协作工作流 Skill</h2>
<label class="row"><input id="skill-enabled" type="checkbox" aria-describedby="skill-status" disabled><span>启用 GPT-6.2 协作与蜂群工作流 Skill</span></label>
<div class="skill-actions"><label for="skill-language">语言</label>
<select id="skill-language" disabled><option value="zh">中文</option><option value="en">English</option></select>
<button id="skill-sync" type="button" hidden>同步模板</button></div>
<p id="skill-status" role="status">正在读取 Skill 设置…</p>
<p id="skill-error" role="alert" hidden></p>
</section>
</main></body></html>
